name: Actualizar Precios RAM Argentina

on:
  schedule:
    # Todos los días a las 09:00 AM hora Argentina (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper de tiendas AR
        run: python actualizar.py

      - name: Confirmar cambios en datos.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add datos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización diaria de precios RAM AR (8GB y 16GB)" && git push)
